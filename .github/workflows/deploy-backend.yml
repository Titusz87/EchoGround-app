name: Deploy FastAPI Backend

on:
  push:
    branches:
      - main  # Automatically fires when code updates hit the main branch
    paths:
      - 'backend/**'  # ONLY runs if files inside the backend subfolder change
  pull_request:
    branches:
      - main  # Runs a syntax/install check on open PRs without deploying
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Project Tools
        run: |
          python -m pip install --upgrade pip
          pip install uv fastapi[standard]

      - name: Verify Backend Imports
        run: |
          cd backend
          uv run python -c "import app.main"

      - name: Deploy Live to FastAPI Cloud
        if: github.event_name != 'pull_request'
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          cd backend
          uv run fastapi deploy