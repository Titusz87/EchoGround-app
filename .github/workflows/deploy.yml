name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main  # Automatically triggers on merges or pushes to main
  workflow_dispatch:  # Lets you run it manually from the Actions tab ("Run workflow")

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd client
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd client
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_VAPID_KEY="${{ secrets.FIREBASE_VAPID_KEY }}" \
            --dart-define=BACKEND_URL="${{ secrets.BACKEND_URL }}" \
            --dart-define=NATIVE_LAND_KEY="${{ secrets.NATIVE_LAND_API_KEY }}" \
            --base-href "/EchoGround-app/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/build/web
          branch: gh-pages  # Pushes production files here directly