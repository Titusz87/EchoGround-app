name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main  # Automatically triggers on merges or pushes to main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd client
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd client
          flutter build web --release \
            --dart-define=FIREBASE_API_KEY="AIzaSyBUy-D-5hh5u7G6ecgzr333R4wdhlK-Lxk" \
            --dart-define=FIREBASE_APP_ID="1:600189671041:web:5cacabe5a91205faaa5f80" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="600189671041" \
            --dart-define=FIREBASE_PROJECT_ID="echoground-9f92d" \
            --dart-define=FIREBASE_VAPID_KEY="${{ secrets.FIREBASE_VAPID_KEY }}" \
            --base-href "/EchoGround-app/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/build/web
          branch: gh-pages  # Pushes production files here directly
