[project]
name = "echoground-backend"
version = "0.1.0"
description = "FastAPI Backend for EchoGround App"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "httpx",
    "apscheduler",
    "python-dotenv",
    "SQLAlchemy",
    "psycopg[binary]",
    "firebase-admin",
    "geopy",
    "numpy",
    "scikit-learn",
    "logtail-python",
]


[tool.fastapi]
entrypoint = "app.main:app"